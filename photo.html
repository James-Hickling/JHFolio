<!DOCTYPE html>

<html>

    <head>

        <!-- Linking style sheets and javascripts-->

        <link rel="stylesheet" href="./styles/portfolio-page-styles.css">

        <script src="./scripts/portfolio-page-scripts.js"></script>

    </head>

    <body>

        <div class="folio-page-content">

            <!-- Photo Folio Heading -->

            <div class="folio-heading-element">

                <div class="folio-heading-container">

                    <div class="folio-heading"><h2><span id="photo-text">Photography</span> Portfolio</h2></div>

                    <!-- Download Button -->

                    <div class="folio-heading-download" onclick="window.location.href='./downloadable files/JHFolio - Photography Portfolio PDF.zip'"><img src="./images/global-icons/download-icon.png"></div>

                </div>

            </div>

            <!-- Left Content side -->

            <div class="folio-content-columns">

                <!-- Photography Board -->

                <div class="folio-content-element">

                    <div class="folio-content-container">

                        <div class="folio-content-heading">
                            <div class="heading board-heading"><h2>MCEA L1 Photography Board</h2></div>

                            <div class="dropdown-button board-button" onclick="openOrCloseDropdown('.board')"><img class="board-img" src="./images/global-icons/dropdown-icon-closed.png"></div>
                        </div>

                        <div class="folio-content closed-dropdown board">
    
                            <div class="content">

                                <img src="./images/photography-images/L1 PHOTO Mini board Design Board.jpg" class="final-content">

                            </div>

                            <div class="side-bar">

                                <div class="grade"><abbr title="Excellence - 5 Credits"><h3>E5</h3></abbr></div>
                                <div class="download-content side-bar-final" onclick="window.location.href='./downloadable files/L1 PHOTO Mini board Photo Board.zip'"><img src="./images/global-icons/download-icon.png"></div>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- In search of the Sea Photo -->

                <div class="folio-content-element">

                    <div class="folio-content-container">

                        <div class="folio-content-heading">
                            <div class="heading search-heading"><h2>In search of the Sea Photo</h2></div>

                            <div class="dropdown-button search-button" onclick="openOrCloseDropdown('.search')"><img class="search-img" src="./images/global-icons/dropdown-icon-closed.png"></div>
                        </div>

                        <div class="folio-content closed-dropdown search">
    
                            <div class="content">

                                <img src="./images/photography-images/In search of the Sea Photo.jpg" class="final-content">

                            </div>

                            <div class="side-bar">

                                <div class="grade"><h3>N/A</h3></div>
                                <div class="download-content side-bar-final" onclick="window.location.href='./downloadable files/In search of the Sea Photo.zip'"><img src="./images/global-icons/download-icon.png"></div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Right Content side -->

            <div class="folio-content-columns">

                <!-- Photography Workbook-->

                <div class="folio-content-element">

                    <div class="folio-content-container">

                        <div class="folio-content-heading">
                            <div class="heading workbook-heading"><h2>NCEA Photo Workbook</h2></div>

                            <div class="dropdown-button workbook-button" onclick="openOrCloseDropdown('.workbook')"><img class="workbook-img" src="./images/global-icons/dropdown-icon-closed.png"></div>
                        </div>

                        <div class="folio-content closed-dropdown workbook">
    
                            <div class="content">

                                <img src="./images/photography-images/James Hickling - Portfolio pages (1) - Digital Workbook.jpg">
                                <img src="./images/photography-images/James Hickling - Portfolio pages (2) - Digital Workbook.jpg">
                                <img src="./images/photography-images/James Hickling - Portfolio pages (3) - Digital Workbook.jpg">
                                <img src="./images/photography-images/James Hickling - Portfolio pages (4) - Digital Workbook.jpg" class="final-content">

                            </div>

                            <div class="side-bar"> 

                                <div class="grade"><abbr title="Excellence - 5 Credits"><h3>E5</h3></abbr></div>
                                <div class="download-content side-bar-final" onclick="window.location.href='./downloadable files/James Hickling - Portfolio pages Photo - Digital Workbook.zip'"><img src="./images/global-icons/download-icon.png"></div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>
            
        </div>

    </body>

</html>
