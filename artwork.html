<!DOCTYPE html>

<html>

    <head>

        <!-- Linking style sheets and javascripts-->

        <link rel="stylesheet" href="./styles/portfolio-page-styles.css">

        <script src="./scripts/portfolio-page-scripts.js"></script>

    </head>

    <body>

        <div class="folio-page-content">

            <!-- Artwork Folio Heading -->

            <div class="folio-heading-element">

                <div class="folio-heading-container">

                    <div class="folio-heading"><h2><span id="artwork-text">Artwork</span> Portfolio</h2></div>

                    <!-- Download Button -->

                    <div class="folio-heading-download" onclick="window.location.href='./downloadable files/JHFolio - Artwork Portfolio PDF.zip'"><img src="./images/global-icons/download-icon.png"></div>

                </div>

            </div>

            <!-- Left Content side -->

            <div class="folio-content-columns">

                <!-- Painting Board -->

                <div class="folio-content-element">

                    <div class="folio-content-container">

                        <div class="folio-content-heading">
                            <div class="heading board-heading"><h2>MCEA L1 Painting Board</h2></div>

                            <div class="dropdown-button board-button" onclick="openOrCloseDropdown('.board')"><img class="board-img" src="./images/global-icons/dropdown-icon-closed.png"></div>
                        </div>

                        <div class="folio-content closed-dropdown board">
    
                            <div class="content">

                                <img src="./images/artwork-images/James Hickling - Painting Board.jpg" class="final-content">

                            </div>

                            <div class="side-bar">

                                <div class="grade"><abbr title="Excellence - 5 Credits"><h3>E5</h3></abbr></div>
                                <div class="download-content side-bar-final"><img src="./images/global-icons/download-icon.png"></div>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- Lighthouse Painting-->

                <div class="folio-content-element">

                    <div class="folio-content-container">

                        <div class="folio-content-heading">
                            <div class="heading painting-heading"><h2>Lighthouse Painting</h2></div>

                            <div class="dropdown-button painting-button" onclick="openOrCloseDropdown('.painting')"><img class="painting-img" src="./images/global-icons/dropdown-icon-closed.png"></div>
                        </div>

                        <div class="folio-content closed-dropdown painting">
    
                            <div class="content">

                                <img src="./images/artwork-images/Lighthouse Painting.jpeg" class="final-content">

                            </div>

                            <div class="side-bar">

                                <div class="grade"><h3>N/A</h3></div>
                                <div class="download-content side-bar-final"><img src="./images/global-icons/download-icon.png"></div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Right Content side -->

            <div class="folio-content-columns">

                <!-- Painting Workbook-->

                <div class="folio-content-element">

                    <div class="folio-content-container">

                        <div class="folio-content-heading">
                            <div class="heading workbook-heading"><h2>NCEA Painting Workbook</h2></div>

                            <div class="dropdown-button workbook-button" onclick="openOrCloseDropdown('.workbook')"><img class="workbook-img" src="./images/global-icons/dropdown-icon-closed.png"></div>
                        </div>

                        <div class="folio-content closed-dropdown workbook">
    
                            <div class="content">

                                <img src="./images/artwork-images/Painting - Workbook page 2.jpg">
                                <img src="./images/artwork-images/Painting - Workbook page 3.jpg">
                                <img src="./images/artwork-images/Painting - Workbook page 4.jpg">
                                <img src="./images/artwork-images/Painting - Workbook page 5.jpg">
                                <img src="./images/artwork-images/Painting - Workbook page 6.jpg">
                                <img src="./images/artwork-images/Painting - Workbook page 7.jpg">
                                <img src="./images/artwork-images/Painting - Workbook page 8.jpg">
                                <img src="./images/artwork-images/Painting - Workbook page 9.jpg">
                                <img src="./images/artwork-images/Painting - Workbook page 10.jpg">
                                <img src="./images/artwork-images/Painting - Workbook page 11.jpg" class="final-content">

                            </div>

                            <div class="side-bar">

                                <div class="grade"><abbr title="Excellence - 5 Credits"><h3>E5</h3></abbr></div>
                                <div class="download-content side-bar-final"><img src="./images/global-icons/download-icon.png"></div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            

        </div>

    </body>

</html>
