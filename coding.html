<!DOCTYPE html>

<html>

    <head>

        <!-- Linking style sheets and javascripts-->

        <link rel="stylesheet" href="./styles/portfolio-page-styles.css">

        <script src="./scripts/portfolio-page-scripts.js"></script>

    </head>

    <body>

        <div class="folio-page-content">

            <!-- Coding Folio Heading -->

            <div class="folio-heading-element">

                <div class="folio-heading-container">

                    <div class="folio-heading"><h2><span id="coding-text">Coding</span> Portfolio</h2></div>

                    <!-- Download Button -->

                    <div class="folio-heading-download" onclick="window.location.href='./downloadable files/JHFolio - Coding Portfolio PDF.zip'"><img src="./images/global-icons/download-icon.png"></div>

                </div>

            </div>

            <!-- Left Content side -->

            <div class="folio-content-columns">

                <!-- Create a program -->

                <div class="folio-content-element">

                    <div class="folio-content-container">

                        <div class="folio-content-heading">
                            <div class="heading program-heading"><h2>NCEA L1 Create a Program</h2></div>

                            <div class="dropdown-button program-button" onclick="openOrCloseDropdown('.program')"><img class="program-img" src="./images/global-icons/dropdown-icon-closed.png"></div>
                        </div>

                        <div class="folio-content closed-dropdown program">
    
                            <div class="content">

                                <img src="./images/coding-images/Create a Program-1.png">
                                <img src="./images/coding-images/Create a Program-2.png">
                                <img src="./images/coding-images/Create a Program-3.png">
                                <img src="./images/coding-images/Create a Program-4.png" class="final-content">

                            </div>

                            <div class="side-bar">

                                <div class="grade"><abbr title="Excellence - 5 Credits"><h3>E5</h3></abbr></div>
                                <div class="download-content side-bar-final" onclick="window.location.href='./downloadable files/Create a Program.zip'"><img src="./images/global-icons/download-icon.png"></div>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- Develop a digital technologies outcome -->

                <div class="folio-content-element">

                    <div class="folio-content-container">

                        <div class="folio-content-heading">
                            <div class="heading develop-heading"><h2>NCEA L1 Develop an Outcome</h2></div>

                            <div class="dropdown-button develop-button" onclick="openOrCloseDropdown('.develop')"><img class="develop-img" src="./images/global-icons/dropdown-icon-closed.png"></div>
                        </div>

                        <div class="folio-content closed-dropdown develop">
    
                            <div class="content">

                                <img src="./images/coding-images/homepage.png">
                                <img src="./images/coding-images/photo-folio.png">
                                <img src="./images/coding-images/artwork-folio.png">
                                <img src="./images/coding-images/design-folio.png">
                                <img src="./images/coding-images/coding-folio.png">
                                <img src="./images/coding-images/academic-folio.png">
                                <img src="./images/coding-images/personal-folio.png" class="final-content">

                            </div>

                            <div class="side-bar">

                                <div class="grade"><abbr title="Excellence - 5 Credits"><h3>E5</h3></abbr></div>
                                <div class="download-content side-bar-final" onclick="window.location.href='./downloadable files/Develop an Outcome.zip'"><img src="./images/global-icons/download-icon.png"></div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Right Content side -->

            <div class="folio-content-columns">

                <!-- Website Design -->

                <div class="folio-content-element">

                    <div class="folio-content-container">

                        <div class="folio-content-heading">
                            <div class="heading website-heading"><h2>MCEA L1 Design a Website</h2></div>

                            <div class="dropdown-button website-button" onclick="openOrCloseDropdown('.website')"><img class="website-img" src="./images/global-icons/dropdown-icon-closed.png"></div>
                        </div>

                        <div class="folio-content closed-dropdown website">
    
                            <div class="content">

                                <img src="./images/coding-images/Digi Tech(1).jpg">
                                <img src="./images/coding-images/Digi Tech(2).jpg">
                                <img src="./images/coding-images/Digi Tech(3).jpg" class="final-content">

                            </div>

                            <div class="side-bar">

                                <div class="grade"><abbr title="Excellence - 5 Credits"><h3>E5</h3></abbr></div>
                                <div class="download-content side-bar-final" onclick="window.location.href='./downloadable files/Digi Tech Design.zip'"><img src="./images/global-icons/download-icon.png"></div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </body>

</html>
